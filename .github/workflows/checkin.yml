name: 掘金自动签到抽奖

on:
  # 定时执行：每天北京时间 08:30（UTC 00:30）
  # 注意：GitHub Actions 定时任务可能有几分钟延迟
  schedule:
    - cron: '30 0 * * *'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: '触发原因'
        required: false
        default: '手动触发'

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 随机延迟（模拟人工操作，0-120秒）
        run: |
          DELAY=$((RANDOM % 120))
          echo "随机等待 ${DELAY} 秒..."
          sleep $DELAY

      - name: 执行签到抽奖
        env:
          JUEJIN_COOKIE: ${{ secrets.JUEJIN_COOKIE }}
          JUEJIN_AID: ${{ secrets.JUEJIN_AID }}
          JUEJIN_UUID: ${{ secrets.JUEJIN_UUID }}
          JUEJIN_SPIDER: ${{ secrets.JUEJIN_SPIDER }}
          JUEJIN_MS_TOKEN: ${{ secrets.JUEJIN_MS_TOKEN }}
          JUEJIN_A_BOGUS: ${{ secrets.JUEJIN_A_BOGUS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: npm start
